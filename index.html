<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Time tracking dashboard</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>

    <!-- Profile Section  -->
    <section class="profile-card">      
        <div class="profile">
          <img src="images/image-jeremy.png" alt="">
          <div>
            <h1>Report for</h1>
          <h2>Jeremy Robson</h2>
          </div>
        </div>
        <!-- <div class="links">
          <button class="profile-link" id="daily">Daily</button>
          <button class="profile-link active" id="weekly">Weekly</button>
          <button class="profile-link" id="monthly">Monthly</button>
        </div> -->
        <div role="tablist" class="links">
          <button class="profile-link" role="tab" aria-selected="true" id="daily" aria-controls="panel-daily">Daily</button>
          <button class="profile-link active" role="tab" aria-selected="false" id="weekly" aria-controls="panel-weekly">Weekly</button>
          <button class="profile-link" role="tab" aria-selected="false" id="monthly" aria-controls="panel-monthly">Monthly</button>
        </div>
        <div id="panel-daily" role="tabpanel" hidden>Daily Content</div>
        <div id="panel-weekly" role="tabpanel" hidden>Weekly Content</div>
        <div id="panel-monthly" role="tabpanel" hidden>Monthly Content</div>
        
    </section>

    
    <!-- Second Section  -->
    <section class="cards" id="cards">
      
   

    </section>

  

  </main>


  
  <footer>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Gideon Akpan</a>.
    </div>
  </footer>


  <script src="app.js"></script>
</body>
</html>
